name: FPGA-GPU CI
on:
  push:
  workflow_dispatch:
    inputs:
      program_mode:
        description: 'FPGA target: SRAM or persistent configuration Flash'
        type: choice
        options: [sram, flash]
        default: sram
permissions:
  contents: read
# Hold the DUT reservation across power-on, loading and power-off jobs.
concurrency:
  group: fpga-testbench
  cancel-in-progress: false
jobs:
  build-sim:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, Linux, X64, vivado]
    timeout-minutes: 60
    concurrency:
      group: vivado-software
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build CI image locally
        run: docker build --tag fpgagpu-ci:local --file ci/Dockerfile .
      - name: Build and test inside Docker
        run: |
          mkdir -p artifacts/software
          git rev-parse HEAD > artifacts/software/source-sha.txt
          git submodule status --recursive > artifacts/software/submodules.txt
          docker image inspect fpgagpu-ci:local --format '{{.Id}}' > artifacts/software/image-id.txt
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --env CTEST_OUTPUT_ON_FAILURE=1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --workdir /workspace fpgagpu-ci:local bash ci/software.sh
      # Reports and diagnostics are retained locally only.
      # - uses: actions/upload-artifact@v4
      #   if: always()
      #   with:
      #     name: software-evidence-${{ github.run_attempt }}
      #     path: artifacts/software/
      #     retention-days: 7
      - name: Preserve software on runner
        if: always()
        run: bash ci/local-artifacts.sh save software
  implementation:
    outputs:
      artifact_attempt: ${{ steps.provenance.outputs.attempt }}
    needs: build-sim
    # Persistent self-hosted runner only executes the repository's default branch.
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, Linux, X64, vivado]
    timeout-minutes: 180
    concurrency:
      group: vivado-tool
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Record implementation artifact attempt
        id: provenance
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Run implementation and quality gates
        env:
          VIVADO_SETTINGS: /opt/Xilinx/2026.1/Vivado/settings64.sh
        run: bash ci/vivado.sh implementation
      # Reports and diagnostics are retained locally only.
      # - uses: actions/upload-artifact@v4
      #   if: always()
      #   with:
      #     name: vivado-implementation-${{ github.run_attempt }}
      #     path: |
      #       artifacts/vivado/*.rpt
      #       artifacts/vivado/*.log
      #       artifacts/vivado/*.jou
      #       artifacts/vivado/*.txt
      #       artifacts/vivado/*.sha256
      #       artifacts/vivado/routed.dcp
      #       artifacts/vivado/modules/
      #       artifacts/vivado/run-logs/
      #     retention-days: 7
      - name: Preserve vivado on runner
        if: always()
        run: bash ci/local-artifacts.sh save vivado
  bitstream:
    outputs:
      artifact_id: ${{ steps.published.outputs.artifact-id }}
      bin_sha256: ${{ steps.digest.outputs.bin_sha256 }}
    needs: implementation
    runs-on: [self-hosted, Linux, X64, vivado]
    timeout-minutes: 45
    concurrency:
      group: vivado-tool
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore implementation checkpoint
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.implementation.outputs.artifact_attempt }}
        run: bash ci/local-artifacts.sh restore vivado
      - name: Generate bitstream from verified checkpoint
        env:
          VIVADO_SETTINGS: /opt/Xilinx/2026.1/Vivado/settings64.sh
        run: bash ci/vivado.sh bitstream
      - name: Preserve bitstream on runner
        if: always()
        run: |
          mkdir -p artifacts/bitstream
          if [ -d artifacts/vivado ]; then
            find artifacts/vivado -maxdepth 1 -type f \( -name 'top.bit' -o -name 'top.bin' -o -name 'bitstream*' -o -name '*version.txt' -o -name 'source-sha.txt' -o -name 'submodules.txt' -o -name 'checkpoint.sha256' \) -exec cp {} artifacts/bitstream/ \;
          fi
          bash ci/local-artifacts.sh save bitstream
      - name: Verify bitstream bundle for transfer
        run: python3 ci/testbench.py verify-bundle artifacts/bitstream --source-sha "$GITHUB_SHA"
      - name: Record binary checksum for downstream validation
        id: digest
        run: |
          digest=$(sha256sum artifacts/bitstream/top.bin)
          echo "bin_sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: published
        with:
          name: fpga-bitstream-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/bitstream/top.bin
          retention-days: 7
          if-no-files-found: error
  power-on:
    needs: bitstream
    runs-on: [self-hosted, testbench]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Power on DUT B and wait for SSH
        run: |
          mkdir -p artifacts/power-on
          set -o pipefail
          python3 -u ci/testbench.py smoke --power-action on 2>&1 | tee artifacts/power-on/power.log
      - name: Preserve power-on diagnostics locally
        if: always()
        run: bash ci/local-artifacts.sh save power-on
  load-bitstream:
    needs: [bitstream, power-on]
    runs-on: [self-hosted, testbench]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.bitstream.outputs.artifact_id }}
          path: artifacts/bitstream
          merge-multiple: true
      - name: Verify, program FPGA and check PCIe
        env:
          VIVADO_LAB_SETTINGS: /opt/Xilinx/2026.1/Vivado_Lab/settings64.sh
          FPGA_PROGRAM_MODE: ${{ inputs.program_mode || 'sram' }}
          EXPECTED_BIN_SHA256: ${{ needs.bitstream.outputs.bin_sha256 }}
        run: |
          mkdir -p artifacts/testbench
          set -o pipefail
          bash ci/load-bitstream.sh artifacts/bitstream --source-sha "$GITHUB_SHA" --bin-sha256 "$EXPECTED_BIN_SHA256" --program-mode "$FPGA_PROGRAM_MODE" 2>&1 | tee artifacts/testbench/loading.log
      - name: Preserve loading diagnostics locally
        if: always()
        run: bash ci/local-artifacts.sh save testbench
      # Reports and diagnostics are retained locally only.
      # - uses: actions/upload-artifact@v4
      #   if: always()
      #   with:
      #     name: testbench-loading-${{ github.run_id }}-${{ github.run_attempt }}
      #     path: artifacts/testbench/
      #     retention-days: 7
  power-off:
    needs: [power-on, load-bitstream]
    if: ${{ always() && needs.power-on.result != 'skipped' }}
    runs-on: [self-hosted, testbench]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Shut down DUT B and verify power is OFF
        run: |
          mkdir -p artifacts/power-off
          set -o pipefail
          python3 -u ci/testbench.py shutdown 2>&1 | tee artifacts/power-off/power.log
      - name: Preserve power-off diagnostics locally
        if: always()
        run: bash ci/local-artifacts.sh save power-off
