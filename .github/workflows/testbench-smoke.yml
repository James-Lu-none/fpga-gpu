name: Testbench Connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, testbench]
    timeout-minutes: 5
    concurrency:
      group: fpga-testbench
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Ensure DUT is powered on and wait for SSH
        run: |
          mkdir -p artifacts/testbench
          set -o pipefail
          python3 -u ci/testbench-smoke.py --power-action on 2>&1 | tee artifacts/testbench/connectivity.log
      - name: Preserve testbench diagnostics locally
        if: always()
        run: bash ci/local-artifacts.sh save testbench
